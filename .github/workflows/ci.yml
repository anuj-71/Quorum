name: Quorum CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Secret Leakage Audit
        run: node scripts/check-secrets.js

      - name: Run Fast Static Linting
        run: npm run lint

      - name: Execute Automated Unit & Component Test Suite
        run: npm test

      - name: Compile Production Distribution Bundle
        run: npm run build
